# ================================================================
# 下载流程优化工具 — docker-compose 配置
# 使用方法：
#   1. 飞牛 NAS：将此文件上传至 NAS，在 Docker Compose 中加载
#   2. 通用：docker-compose up -d
# 说明：本项目为 Windows 桌面 GUI 应用，容器仅用于环境验证
# ================================================================

version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: download-optimizer:latest
    container_name: download-optimizer
    restart: "no"
    volumes:
      - ./data:/app/data
      - ./input:/app/input
      - ./output:/app/output
    environment:
      - TZ=Asia/Shanghai
    command: >
      python -c "
      import openpyxl, requests, json;
      print('=== 下载流程优化工具 环境检查 ===');
      print('openpyxl:', openpyxl.__version__);
      print('requests:', requests.__version__);
      print('Python 依赖全部就绪');
      print('提示: 本工具为 Windows GUI 应用，请在 Windows 主机上运行 EXE 源码');
      "

  # 可选：AI API 代理服务（用于 AI 助手模块的中转）
  api-proxy:
    image: nginx:alpine
    container_name: download-optimizer-proxy
    restart: "unless-stopped"
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - TZ=Asia/Shanghai
    profiles:
      - proxy

volumes:
  data:
  input:
  output:
