name: Build and Publish Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '镜像标签'
        required: false
        default: 'latest'

env:
  IMAGE_NAME: download-optimizer
  DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER || 'szboboxing' }}

jobs:
  build:
    name: 构建与验证
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 代码语法检查
        run: |
          pip install -r requirements.txt
          python -c "import py_compile; py_compile.compile('app.py', doraise=True)"
          python -c "import py_compile; py_compile.compile('main.py', doraise=True)"
          python -c "import openpyxl, requests; print('All dependencies OK')"

      - name: 构建 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: ./Dockerfile
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 验证容器运行
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:latest

      - name: 上传构建缓存
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-cache
          path: /tmp/.dockerx-cache

  publish:
    name: 发布到 Docker Hub
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: Docker Hub 登录
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: 提取版本号
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 构建并推送镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_HUB_USER }}/${{ env.IMAGE_NAME }}:latest

      - name: 输出镜像地址
        run: |
          echo "✅ 镜像已发布"
          echo "   Docker Hub: https://hub.docker.com/r/${{ secrets.DOCKER_HUB_USER }}/${{ env.IMAGE_NAME }}"
          echo "   标签: ${{ steps.version.outputs.version }}"
          echo "   拉取: docker pull ${{ secrets.DOCKER_HUB_USER }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"

  github-pages:
    name: 更新 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: 上传文档
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署 Pages
        uses: actions/deploy-pages@v4
